name: Build and release Windows executable

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore test and application dependencies
        run: dotnet restore src/WindowAgentMcp.Tests/WindowAgentMcp.Tests.csproj

      - name: Run unit tests
        run: dotnet test src/WindowAgentMcp.Tests/WindowAgentMcp.Tests.csproj --configuration Release --no-restore

      - name: Publish self-contained win-x64 executable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          dotnet publish src/WindowAgentMcp/WindowAgentMcp.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish/win-x64 `
            "/p:Version=$version" `
            "/p:InformationalVersion=$version+$env:GITHUB_SHA"

      - name: Create GitHub Release and attach executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG `
            artifacts/publish/win-x64/WindowAgentMcp.exe `
            --verify-tag `
            --title $env:RELEASE_TAG `
            --generate-notes
