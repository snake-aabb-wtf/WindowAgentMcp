name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore test and application dependencies
        run: dotnet restore src/WindowAgentMcp.Tests/WindowAgentMcp.Tests.csproj

      - name: Build application
        run: dotnet build src/WindowAgentMcp/WindowAgentMcp.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test src/WindowAgentMcp.Tests/WindowAgentMcp.Tests.csproj --configuration Release --no-restore
